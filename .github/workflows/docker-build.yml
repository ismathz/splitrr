name: Docker build and push

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILDKIT: 1

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Compose build
        working-directory: .build
        run: docker compose -f compose.yml build

      - name: Tag commit SHA
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/splitbot/apps/miniapp"
          docker tag "${IMAGE}:latest" "${IMAGE}:${GITHUB_SHA}"

      - name: Docker Compose push
        if: github.event_name != 'pull_request'
        working-directory: .build
        run: docker compose -f compose.yml push

      - name: Push SHA tag
        if: github.event_name != 'pull_request'
        run: docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/splitbot/apps/miniapp:${GITHUB_SHA}"
