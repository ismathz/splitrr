services:
  miniapp:
    build:
      context: ../
      dockerfile: .build/miniapp.Dockerfile
      args:
        VITE_SPLITBOT_API: ${VITE_SPLITBOT_API:-}
        VITE_BOT_MINIAPP_API: ${VITE_BOT_MINIAPP_API:-}
    hostname: miniapp
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ismathz}/splitbot/apps/miniapp:latest

  api:
    build:
      context: ../
      dockerfile: .build/api.Dockerfile
    hostname: api
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ismathz}/splitbot/apps/api:latest
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    volumes:
      - splitbot-data:/data
    environment:
      SQLITE_PATH: /data/splitbot.db

  bot:
    build:
      context: ../
      dockerfile: .build/bot.Dockerfile
    hostname: bot
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ismathz}/splitbot/apps/bot:latest
    ports:
      - "3001:3001"
    env_file:
      - ../.env
    volumes:
      - splitbot-data:/data
    environment:
      SQLITE_PATH: /data/splitbot.db

volumes:
  splitbot-data:
